name: studio

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "package.json", "bun.lock", ".github/workflows/studio.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "package.json", "bun.lock", ".github/workflows/studio.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true
      # Bun's registry fetch fails now and then on a runner, and a fresh cache
      # is all it takes, so one retry keeps a green branch from going red.
      - name: install
        run: |
          bun install --frozen-lockfile || {
            rm -rf node_modules
            bun pm cache rm || true
            bun install --frozen-lockfile
          }
      - run: bun run --filter @kinesthesia/studio ensure-electron
      - run: bun run --filter @kinesthesia/web build
      - run: bun run --filter @kinesthesia/studio package
      # A packaged build that opens no window is worth nothing, so each system
      # starts its own and waits for the app to answer.
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run --filter @kinesthesia/studio smoke
      - if: runner.os != 'Linux'
        run: bun run --filter @kinesthesia/studio smoke
      - uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.artifact }}
          path: |
            apps/studio/release/*.dmg
            apps/studio/release/*.exe
            apps/studio/release/*.AppImage
          retention-days: 7
          if-no-files-found: error
