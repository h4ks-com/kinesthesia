name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be put through the full matrix before it is proposed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true
      # Bun's registry fetch fails now and then on a runner, and a fresh cache
      # is all it takes, so one retry keeps a green branch from going red.
      - name: install
        run: |
          bun install --frozen-lockfile || {
            rm -rf node_modules
            bun pm cache rm || true
            bun install --frozen-lockfile
          }
      - run: bun run ci

  e2e:
    runs-on: ubuntu-latest
    # The suite is spread across runners so the whole run takes about as long as
    # one shard. A failing shard leaves the others running, so one push reports
    # every failure at once.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true
      # Bun's registry fetch fails now and then on a runner, and a fresh cache
      # is all it takes, so one retry keeps a green branch from going red.
      - name: install
        run: |
          bun install --frozen-lockfile || {
            rm -rf node_modules
            bun pm cache rm || true
            bun install --frozen-lockfile
          }
      - run: bunx playwright install --with-deps chromium firefox
      # The song clock is the audio clock, so a runner with no sound device is a
      # player that never starts. A dummy sink is enough for it to run.
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start --exit-idle-time=-1
      - run: bun run test:e2e --shard=${{ matrix.shard }}/6
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
