name: studio

on:
  push:
    # studio-monorepo is here so the matrix can be proven before it merges.
    branches: [main, studio-monorepo]
    paths: ["apps/**", "packages/**", "package.json", "bun.lock", ".github/workflows/studio.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "package.json", "bun.lock", ".github/workflows/studio.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run --filter @kinesthesia/studio ensure-electron
      - run: bun run --filter @kinesthesia/web build
      - run: bun run --filter @kinesthesia/studio package
      - uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.artifact }}
          path: |
            apps/studio/release/*.dmg
            apps/studio/release/*.exe
            apps/studio/release/*.AppImage
          retention-days: 7
          if-no-files-found: error
